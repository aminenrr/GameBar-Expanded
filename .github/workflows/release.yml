name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dl
      - name: Zip
        run: |
          v="${GITHUB_REF_NAME#v}"
          (cd dl/ControlsHub-package && zip -qr "../../ControlsHub-$v-package-x64.zip" .)
          (cd dl/ControlsHub-tools && zip -qr "../../ControlsHub-$v-tools-x64.zip" .)
          cp dl/ControlsHub-package/*.msix "ControlsHub-$v-x64.msix"
          cp dl/ControlsHub-package/ControlsHub-dev.cer "ControlsHub-$v-dev.cer"
          sha256sum ControlsHub-$v-* > SHA256SUMS
          cat SHA256SUMS
          echo "VER=$v" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Controls Hub ${{ env.VER }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            ControlsHub-${{ env.VER }}-package-x64.zip
            ControlsHub-${{ env.VER }}-tools-x64.zip
            ControlsHub-${{ env.VER }}-x64.msix
            ControlsHub-${{ env.VER }}-dev.cer
            SHA256SUMS
          prerelease: ${{ contains(github.ref_name, '-') }}
