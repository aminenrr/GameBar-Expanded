name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Protocol tests
        run: dotnet test tests/ControlsHub.Protocol.Tests -c Release

      - name: Publish broker and tools (NativeAOT)
        run: |
          dotnet publish src/ControlsHub.Broker/ControlsHub.Broker.csproj -c Release -o artifacts/broker
          dotnet publish tools/DummyApp/DummyApp.csproj -c Release -o artifacts/tools/DummyApp
          dotnet publish tools/SpikeTests/SpikeTests.csproj -c Release -o artifacts/tools/SpikeTests

      - name: Broker self test (WinRT AppService types under NativeAOT)
        shell: pwsh
        run: |
          $p = Start-Process artifacts/broker/ControlsHub.Broker.exe -ArgumentList '--selftest' `
               -RedirectStandardOutput selftest.txt -NoNewWindow -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest exit code $($p.ExitCode)" }

      - name: Smoke test (DummyApp pushes over the pipe, broker console receives)
        shell: pwsh
        run: |
          $d = Start-Process artifacts/tools/DummyApp/DummyApp.exe -ArgumentList '--auto','60' `
               -RedirectStandardOutput dummy.txt -NoNewWindow -PassThru
          $b = Start-Process artifacts/broker/ControlsHub.Broker.exe -ArgumentList '--console','--exit-after','20' `
               -RedirectStandardOutput broker.txt -NoNewWindow -PassThru -Wait
          if (-not $d.WaitForExit(30000)) { $d.Kill() }
          Write-Host '--- DummyApp'; Get-Content dummy.txt
          Write-Host '--- broker'; Get-Content broker.txt
          $log = Get-Content broker.txt -Raw
          foreach ($want in 'hello from dummy', 'nav stream on', 'state preset=custom', 'nav cross down', 'after 50 state changes') {
            if ($log -notmatch [regex]::Escape($want)) { throw "smoke test: broker output lacks '$want'" }
          }
          if ($d.ExitCode -ne 0) { throw "DummyApp exit code $($d.ExitCode)" }

      - name: Build widget and MSIX (msbuild, UWP)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest `
                     -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          Write-Host "msbuild: $msbuild"
          & $msbuild src/ControlsHub.Widget/ControlsHub.Widget.csproj /restore /m /v:minimal /nologo `
            /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true `
            "/p:AppxPackageDir=$PWD/artifacts/AppPackages/" "/p:BrokerPublishDir=$PWD/artifacts/broker/"
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed ($LASTEXITCODE)" }
          Get-ChildItem artifacts/AppPackages -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Sign with a throwaway test certificate
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force artifacts/package
          $msix = Get-ChildItem artifacts/AppPackages -Recurse -File |
                  Where-Object { $_.Extension -in '.msix', '.appx' -and $_.FullName -notmatch '\\Dependencies\\' } |
                  Select-Object -First 1
          if (-not $msix) { throw 'no msix produced' }
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=aminenrr' -KeyUsage DigitalSignature `
                  -FriendlyName 'Controls Hub dev (CI)' -CertStoreLocation Cert:\CurrentUser\My `
                  -NotAfter (Get-Date).AddYears(1) `
                  -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pw = [Guid]::NewGuid().ToString('N')
          $pfx = Join-Path $env:RUNNER_TEMP 'dev.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pw -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath "$out\ControlsHub-dev.cer" | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName | Select-Object -Last 1
          $dest = Join-Path $out 'ControlsHub_0.1.0.0_x64.msix'
          Copy-Item $msix.FullName $dest
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $pw $dest
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }
          Remove-Item $pfx -Force
          Remove-Item $cert.PSPath -Force
          $deps = Get-ChildItem artifacts/AppPackages -Recurse -Directory -Filter Dependencies | Select-Object -First 1
          if ($deps -and (Test-Path "$($deps.FullName)\x64")) {
            New-Item -ItemType Directory -Force "$out\Dependencies\x64" | Out-Null
            Copy-Item "$($deps.FullName)\x64\*" "$out\Dependencies\x64\"
          }
          Copy-Item dev/install.ps1, dev/uninstall.ps1, docs/P0-TEST.md $out
          Get-ChildItem $out -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Stage tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/tools/Broker | Out-Null
          Copy-Item artifacts/broker/ControlsHub.Broker.exe artifacts/tools/Broker/
          Get-ChildItem artifacts/tools -Recurse -Filter *.pdb | Remove-Item
          Get-ChildItem artifacts/tools -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ControlsHub-package
          path: artifacts/package/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ControlsHub-tools
          path: artifacts/tools/

      - name: Diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows Kits\10\ExtensionSDKs" -Directory -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object FullName
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory -ErrorAction SilentlyContinue | Select-Object Name
